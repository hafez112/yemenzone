# 📱 بناء تطبيق يمن زون لأندرويد سحابياً — بدون حاسوب
# يعمل تلقائياً عند أي تعديل على apps/mobile، أو يدوياً من تبويب Actions → Run workflow
# الناتج: ملف APK جاهز للتثبيت من صفحة Artifacts، وملف AAB لجوجل بلاي عند إضافة أسرار التوقيع
name: 📱 بناء تطبيق أندرويد

on:
  push:
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: بناء APK (للتثبيت المباشر)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: قبول التراخيص وتثبيت مكونات SDK المطلوبة
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الاعتماديات والمزامنة وبناء APK (خطوة موحدة)
        working-directory: apps/mobile
        run: |
          set -e
          echo "===== 1) البيئة ====="
          echo "📂 المسار: $(pwd)"
          echo "🔢 node=$(node -v) npm=$(npm -v) NODE_ENV=${NODE_ENV:-none} CI=${CI:-none}"
          echo "===== 2) التثبيت ====="
          npm ci --include=dev --workspaces=false --no-audit --no-fund || npm install --include=dev --workspaces=false --no-audit --no-fund
          echo "===== 3) فحص التثبيت ====="
          if [ ! -d node_modules ]; then
            echo "❌ node_modules غير موجود هنا! npm ثبّت في مكان آخر:"
            echo "prefix = $(npm config get prefix)"
            echo "محتوى الجذر:" && ls -la ../.. | head -20
            echo "محتوى المجلد الأب:" && ls -la .. | head -20
            find /home/runner/work -maxdepth 4 -name "@capacitor" -type d 2>/dev/null | head -5
            exit 1
          fi
          echo "✅ node_modules موجود — عدد الحزم: $(ls node_modules | wc -l)"
          ls node_modules/.bin | head -10
          echo "===== 4) مزامنة Capacitor ====="
          node node_modules/@capacitor/cli/bin/capacitor sync android
          ls node_modules/@capacitor/android/capacitor/build.gradle
          echo "===== 5) بناء APK ====="
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "===== 6) الناتج ====="
          ls -la app/build/outputs/apk/debug/

      - name: رفع الناتج
        uses: actions/upload-artifact@v4
        with:
          name: yemen-zone-app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-bundle:
    name: بناء AAB (لجوجل بلاي — يتطلب أسرار التوقيع)
    runs-on: ubuntu-latest
    # يعمل فقط إذا أُضيفت أسرار التوقيع في إعدادات المستودع
    if: ${{ vars.KEYSTORE_CONFIGURED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: إعداد Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: قبول التراخيص وتثبيت مكونات SDK المطلوبة
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: إعداد Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: تثبيت الاعتماديات والمزامنة (خطوة موحدة)
        working-directory: apps/mobile
        run: |
          set -e
          echo "📂 المسار: $(pwd)"
          npm ci --include=dev --workspaces=false --no-audit --no-fund || npm install --include=dev --workspaces=false --no-audit --no-fund
          if [ ! -d node_modules ]; then
            echo "❌ node_modules غير موجود بعد التثبيت"
            exit 1
          fi
          echo "✅ عدد الحزم: $(ls node_modules | wc -l)"
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: فك تشفير مفتاح التوقيع
        working-directory: apps/mobile/android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > yemenzone.keystore
          printf "storeFile=yemenzone.keystore\nstorePassword=%s\nkeyAlias=yemenzone\nkeyPassword=%s\n" "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_PASSWORD }}" > keystore.properties

      - name: بناء AAB موقّع
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: رفع حزمة جوجل بلاي
        uses: actions/upload-artifact@v4
        with:
          name: yemen-zone-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
